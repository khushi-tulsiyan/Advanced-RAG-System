[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-rag-system"
version = "2.0.0"
description = "Hybrid (BM25 + dense) retrieval with cross-encoder reranking and a FastAPI service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Core runtime. The ML stack is optional so the package installs and its tests
# run without pulling in torch.
dependencies = [
    "numpy>=1.24",
    "rank-bm25>=0.2.2",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
# Real embedding + reranking models.
ml = [
    "sentence-transformers>=2.5",
    "torch>=2.0",
]
# Approximate nearest-neighbour search. Falls back to numpy when absent.
faiss = ["faiss-cpu>=1.7.4"]
# Fine-tuning the reranker.
train = [
    "transformers>=4.40",
    "datasets>=2.18",
    "accelerate>=0.27",
]
# Generation-quality metrics.
eval = [
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires the optional ML stack or a running server",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom.
